<div class="home-container">
  <div class="hero-card glass-panel">
    <h1 class="welcome-heading">{{ welcomeHeading }}</h1>
    <p class="welcome-description">{{ welcomeDescription }}</p>
  </div>

  <div class="stats-row">
    <div class="stat-card glass-panel">
      <div class="stat-icon">📚</div>
      <div class="stat-content">
        <span class="stat-label">Courses Available</span>
        <span class="stat-value">{{ coursesAvailable }}</span>
      </div>
    </div>

    <div class="stat-card glass-panel">
      <div class="stat-icon">🎯</div>
      <div class="stat-content">
        <span class="stat-label">Enrolled</span>
        <span class="stat-value">{{ coursesEnrolled }}</span>
      </div>
    </div>

    <div class="stat-card glass-panel">
      <div class="stat-icon">⭐</div>
      <div class="stat-content">
        <span class="stat-label">GPA</span>
        <span class="stat-value">{{ gpa }}</span>
      </div>
    </div>
  </div>
</div>
